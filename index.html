else if(dk==='tron'){g.strokeStyle=c2;g.lineWidth=w*.05;g.strokeRect(x+w*.1,y+h*.04,w*.8,h*.92);g.beginPath();g.moveTo(x+w*.5,y+h*.04);g.lineTo(x+w*.5,y+h*.25);g.moveTo(x+w*.5,y+h*.75);g.lineTo(x+w*.5,y+h*.96);g.stroke()}
else if(dk==='panel'){g.strokeStyle=c2;g.lineWidth=1.5;g.beginPath();g.moveTo(x+w*.5,y);g.lineTo(x+w*.5,y+h);g.moveTo(x,y+h*.35);g.lineTo(x+w,y+h*.35);g.moveTo(x,y+h*.78);g.lineTo(x+w,y+h*.78);g.stroke()}
else if(dk==='mud'){for(const[a,b]of[[.15,.9],[.3,.82],[.7,.88],[.85,.78],[.5,.95],[.2,.7],[.78,.68]]){g.beginPath();g.arc(x+w*a,y+h*b,w*.07,0,7);g.fill()}}
else if(dk==='hearts'){for(const[a,b]of[[.25,.1],[.7,.18],[.5,.52],[.22,.58],[.8,.55],[.35,.88],[.68,.86]])heart(x+w*a,y+h*b,w*.1)}
else if(dk==='turkey'){g.beginPath();g.ellipse(x+w/2,y+h*.55,w*.36,h*.3,0,0,7);g.fill();g.fillStyle='#c1121f';g.beginPath();g.arc(x+w/2,y+h*.11,w*.1,0,7);g.fill()}
else if(dk==='sleigh'){g.fillRect(x,y,w,h*.07);g.fillRect(x,y+h*.93,w,h*.07);g.fillStyle='#d4af37';g.fillRect(x+w*.46,y+h*.1,w*.08,h*.8)}
else if(dk==='y27'){g.fillRect(x+w*.1,y,w*.04,h);g.fillRect(x+w*.86,y,w*.04,h)}
g.restore()}
rr(x+w*.15,y+h*.25,w*.7,h*.2,4,'#cfe8ff');rr(x+w*.15,y+h*.62,w*.7,h*.12,3,'rgba(0,0,0,.35)');
if(dk==='y27'){g.save();g.translate(cx,cy);g.rotate(-Math.PI/2);g.font='bold '+(w*.5)+'px -apple-system,system-ui,sans-serif';g.textAlign='center';g.fillStyle=c2;g.strokeStyle='#000';g.lineWidth=2;g.strokeText('2027',0,w*.17);g.fillText('2027',0,w*.17);g.restore()}
if(dk==='turkey'){g.fillStyle='#ffa500';g.beginPath();g.moveTo(cx-w*.1,y+h*.03);g.lineTo(cx,y-h*.07);g.lineTo(cx+w*.1,y+h*.03);g.fill()}}
function coin(x,y,r){g.fillStyle='#f5c542';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.strokeStyle='#b8860b';g.lineWidth=2;g.beginPath();g.arc(x,y,r*.62,0,7);g.stroke()}
function txt(s,x,y,px,b,c){g.font=F(px,b);g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function draw(){const bg=state==='play'?TH.road:'#101218';if(bg!==curBg){curBg=bg;document.documentElement.style.background=bg;document.body.style.background=bg}g.textAlign='center';g.fillStyle=TH.grass;g.fillRect(0,0,W,H);
g.fillStyle=TH.road;g.fillRect(RX,0,RW,H);
g.fillStyle=TH.edge;g.fillRect(RX,0,4,H);g.fillRect(RX+RW-4,0,4,H);
for(let i=1;i<4;i++){g.fillStyle=i==2?TH.mid:TH.dash;for(let y=-H*.1+off;y<H;y+=H*.1)g.fillRect(RX+i*LW-2,y,4,H*.05)}
scenery();const cols=['#7a7f94','#8a6f5a','#6a8a80'];
for(const o of obs){if(TH.k==='win')tree(o);else{rr(o.x,o.y,o.w,o.h,o.h*.3,cols[o.c]);rr(o.x+o.w*.12,o.y+o.h*.12,o.w*.4,o.h*.25,o.h*.1,'rgba(255,255,255,.25)')}}
for(const c of coins)coin(c.x,c.y,LW*.14);
drawTrail();car(carX,carY,CW,D.skin);
snowfall();for(const f of fl){g.globalAlpha=Math.max(0,f.l);txt(f.t,f.x,f.y,18,1,'#ffd84d')}g.globalAlpha=1;
if(flash>0){g.fillStyle='rgba(255,255,255,'+flash*.6+')';g.fillRect(0,0,W,H);flash=Math.max(0,flash-.05)}
if(state==='play'){g.shadowColor='rgba(0,0,0,.7)';g.shadowBlur=5;txt(score+' m',W/2,SAT+44,24,1);const ct=''+D.coins;g.font=F(20,1);const cw=g.measureText(ct).width;coin(W-16-cw-14,SAT+39,9);g.textAlign='right';txt(ct,W-16,SAT+45,20,1);g.textAlign='center';g.shadowBlur=0}
else menu()}
let btns=[],msg='',msgUntil=0;
function startGame(){if(performance.now()-overAt<400)return;view=D.skin;reset();state='play';sfx('start');startEngine();startMusic()}
function btn(l,x,y,w,h,col,fn,tc,fs){g.fillStyle=col;g.beginPath();g.roundRect(x-w/2,y-h/2,w,h,h/4);g.fill();txt(l,x,y+(fs||h*.42)*.33,fs||h*.42,1,tc);btns.push({x:x-w/2,y:y-h/2,w,h,fn})}
function menu(){btns=[];if(scr==='settings')return settings();if(scr==='ach')return achv();if(scr==='locker')return locker();const over=state==='over';g.fillStyle='rgba(10,12,18,.86)';g.fillRect(0,0,W,H);
txt(over?'CRASHED':'DODGE',W/2,H*.17,40,1);
txt(over?score+' m  ·  '+(newBest?'NEW BEST!':'Best '+D.best+' m')+'  ·  +'+cr+' coins':'Drag left / right to steer',W/2,H*.21,16,0,'#cfd3e0');
coin(W/2-42,H*.25,8);txt(D.coins+' coins',W/2+10,H*.255,16,1,'#f5c542');
car(W/2,H*.33,64,D.skin);btns.push({x:W/2-60,y:H*.33-68,w:120,h:136,fn:openLocker});
txt(SK[D.skin][0],W/2,H*.43+7,20,1);txt('Trail: '+TR[D.trail][0],W/2,H*.43+26,13,0,'#8a90a6');
btn('🚗 Locker',W/2,H*.5,210,44,'#3b82f6',openLocker,'#fff');
const ev=['tg','xm','ny'].filter(k=>SEA[k]).map(k=>SEAN[k][0]).join(' + ');if(ev)txt('🎉 '+ev+' event!',W/2,H*.545,14,1,'#f5c542');
txt("Today's best",W/2,H*.58,18,1,'#f5c542');
for(let i=0;i<5;i++)txt((i+1)+'.  '+(D.list[i]!=null?D.list[i]+' m':'—'),W/2,H*.615+i*H*.035,17,0,D.list[i]!=null?'#fff':'#6b7084');
txt('v14',W/2,H*.93,12,0,'#555a6e');
btn(over?'Retry':'Start',W/2,H*.83,220,54,'#e5484d',startGame,'#fff');
btn('⚙️',34,SAT+62,46,42,'#2b2f3d',()=>{scr='settings';confirmReset=false},'#fff');
btn('🏆',W-34,SAT+62,46,42,'#2b2f3d',()=>{scr='ach';ap=0},'#fff');
if(claimable()){g.fillStyle='#ff3b30';g.beginPath();g.arc(W-34+17,SAT+62-15,7,0,7);g.fill()}}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
let dragging=false,lx=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);dragging=true;lx=e.clientX;actx();
if(state==='play')return;
for(const b of btns)if(e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h){sfx('click');b.fn();return}});
cv.addEventListener('pointermove',e=>{if(!dragging||state!=='play')return;carX=cl(carX+(e.clientX-lx)*1.3);lx=e.clientX});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>dragging=false));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key=-1;else if(e.key==='ArrowRight')key=1;
else if((e.key===' '||e.key==='Enter')&&state!=='play')startGame();});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'&&key<0||e.key==='ArrowRight'&&key>0)key=0});
document.addEventListener('visibilitychange',()=>{last=performance.now();TH=mkTheme();SEA=seasonNow();if(document.hidden){save();stopEngine();stopMusic()}else if(state==='play'){startEngine();startMusic()}});
document.addEventListener('gesturestart',e=>e.preventDefault());
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
